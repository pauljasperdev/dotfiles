bind r source-file ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g extended-keys on


unbind-key C-b
set -g prefix 'C-a'
bind-key 'C-a' send-prefix


# Rename your terminals
set -g set-titles on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
set -s copy-command 'pbcopy'



bind c new-window -c "#{pane_current_path}"
unbind-key '"'
bind | split-window -h -c "#{pane_current_path}"
unbind-key %
bind - split-window -v -c "#{pane_current_path}"

# resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind m resize-pane -Z

#set -g status-utf8 on
set -g status-interval 5
set -g status-position top
set-option -g default-shell /bin/zsh

bind -r m resize-pane -Z

bind-key -n C-t send-prefix

set -g @resurrect-save 'S'

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W:#{b:pane_current_path}"
set -g @catppuccin_window_current_text " #W:#{b:pane_current_path}"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_right_separator ""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-network-bandwidth'
set -g @tmux-network-bandwidth-padding 8

set -g @continuum-restore 'on'


set -as terminal-features ',xterm-256color:clipboard:extkeys'
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ",alacritty:RGB"

set -g mouse on
set -g focus-events on

run '~/.tmux/plugins/tpm/tpm'

# Clear stale window styles (catppuccin uses format strings, not style options)
set -g window-status-style ""
set -g window-status-current-style ""

# Custom modules — hardcoded mocha colors, #{l:...} protects plugin
# format strings from expansion so re-run interpolation can find them
set -g @catppuccin_status_memory "#[fg=#94e2d5]#[bg=default]#[fg=#11111b,bg=#94e2d5]󰍛 #[fg=#cdd6f4,bg=#313244] #{l:#{ram_percentage}}#[fg=#313244]#[bg=default]"

set -g @catppuccin_status_network "#[fg=#89b4fa]#[bg=default]#[fg=#11111b,bg=#89b4fa]󰛳 #[fg=#cdd6f4,bg=#313244] #{l:#{network_bandwidth}}#[fg=#313244]#[bg=default]"

# Status line
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -agF status-right " #{E:@catppuccin_status_cpu}"
set -agF status-right " #{E:@catppuccin_status_memory}"
set -agF status-right " #{E:@catppuccin_status_network}"
set -ag status-right " #{E:@catppuccin_status_date_time}"
set -agF status-right " #{E:@catppuccin_status_battery}"

# Re-run plugin interpolation on the now-complete status-right
# (plugins ran during TPM before status-right was configured)
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-battery/battery.tmux'
run '~/.tmux/plugins/tmux-network-bandwidth/tmux-network-bandwidth.tmux'
